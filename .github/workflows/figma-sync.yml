name: Figma Variables Automated Sync

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

jobs:
  sync-figma-tokens:
    name: Sync Figma Variables REST API
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Figma API Secrets Status
        env:
          FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: |
          if [ -n "$FIGMA_PERSONAL_ACCESS_TOKEN" ] && [ -n "$FIGMA_FILE_KEY" ]; then
            echo "### ⚡ Figma Sync Status: **ACTIVE**" >> $GITHUB_STEP_SUMMARY
            echo "Figma credentials (FIGMA_PERSONAL_ACCESS_TOKEN & FIGMA_FILE_KEY) are configured." >> $GITHUB_STEP_SUMMARY
            echo "STATUS=ACTIVE" >> $GITHUB_ENV
          else
            echo "### ⚠️ Figma Sync Status: **DORMANT**" >> $GITHUB_STEP_SUMMARY
            echo "Figma credentials (FIGMA_PERSONAL_ACCESS_TOKEN and/or FIGMA_FILE_KEY) are missing in repository secrets." >> $GITHUB_STEP_SUMMARY
            echo "STATUS=DORMANT" >> $GITHUB_ENV
          fi

      - name: Fetch Figma Variables via REST API
        env:
          FIGMA_PERSONAL_ACCESS_TOKEN: ${{ secrets.FIGMA_PERSONAL_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node scripts/fetch-figma-variables.mjs

      - name: Build Design Tokens, CSS & Components
        run: npm run build

      - name: Open Pull Request if Tokens Changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(tokens): automated sync from Figma Variables REST API'
          title: '🎨 Automated Figma Variables Sync'
          body: |
            ## Automated Figma Variables Sync
            This PR was automatically generated by the scheduled Figma REST API sync workflow.

            ### Changes Included
            - Synced `tokens.json` directly from Figma Variables REST API
            - Recompiled 3-Tier CSS Custom Properties (`dist/styles.css`)
            - Recompiled shadcn Component Registry (`dist/r/*.json`)
            - Passed token contract gate and vitest-axe accessibility assertions.
          branch: figma-tokens-sync
          base: main
          labels: |
            design-tokens
            automated-pr
