name: Vektr Design System CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update Playwright baseline visual snapshots'
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Tokens, CSS & React Bundle
        run: npm run build

      - name: Run Token Contract & Vitest Unit Tests (with vitest-axe)
        run: npm test

      - name: Lint Package Exports with Publint
        run: npx publint

      - name: Check Module Types with @arethetypeswrong/cli
        run: |
          npm pack
          npx @arethetypeswrong/cli *.tgz --ignore-rules no-resolution
          rm -f *.tgz

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Visual Regression Matrix
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --update-snapshots
          else
            npx playwright test
          fi

      - name: Upload Playwright Test Results & Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
