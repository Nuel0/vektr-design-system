name: Vektr Design System CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Tokens, CSS & React Bundle
        run: npm run build

      - name: Run Token Contract & Vitest Unit Tests (with vitest-axe)
        run: npm test

      - name: Lint Package Exports with Publint
        run: npx publint

      - name: Check Module Types with @arethetypeswrong/cli
        run: npx @arethetypeswrong/cli --pack .

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Visual Regression Matrix
        run: npx playwright test
